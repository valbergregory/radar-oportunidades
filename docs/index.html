<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radar de Oportunidades</title>
<style>
  :root { --fundo:#f6f7f9; --cartao:#fff; --texto:#1c2430; --suave:#5b6675; --marca:#0b5cab; --borda:#dde2e8; }
  @media (prefers-color-scheme: dark) {
    :root { --fundo:#12161c; --cartao:#1b212a; --texto:#e8ecf1; --suave:#9aa6b5; --marca:#6db3ff; --borda:#2c3440; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--fundo); color:var(--texto); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  .sub { color: var(--suave); margin: 0 0 20px; }
  fieldset { border:1px solid var(--borda); border-radius:10px; margin:0 0 12px; padding:10px 14px; background:var(--cartao); }
  legend { font-weight:600; padding:0 6px; }
  label { display:inline-block; margin: 4px 14px 4px 0; cursor:pointer; }
  input[type=search] { width:100%; padding:10px 12px; border:1px solid var(--borda); border-radius:10px; background:var(--cartao); color:inherit; font:inherit; margin-bottom:12px; }
  ul { list-style:none; padding:0; margin:16px 0 0; }
  li { background:var(--cartao); border:1px solid var(--borda); border-radius:10px; padding:14px 16px; margin-bottom:10px; }
  li a { color:var(--marca); font-weight:600; text-decoration:none; }
  li a:hover { text-decoration:underline; }
  .meta { color:var(--suave); font-size:.9rem; margin-top:6px; }
  .etq { display:inline-block; border:1px solid var(--borda); border-radius:999px; padding:0 8px; margin-right:6px; font-size:.8rem; }
  .urgente { color:#c2410c; font-weight:600; }
  #conta { color:var(--suave); }
</style>
</head>
<body>
<main>
  <h1>Radar de Oportunidades</h1>
  <p class="sub">Editais, bolsas, seleções, eventos e vagas. Atualizado em <span id="atualizado"></span>.
     Os prazos são estimados e devem ser conferidos no edital.
     <a href="prazos.ics">Assinar o calendário de prazos</a></p>

  <input type="search" id="busca" placeholder="Buscar por palavra" aria-label="Buscar por palavra">
  <fieldset><legend>Minhas áreas</legend><div id="areas"></div></fieldset>
  <fieldset><legend>Tipo</legend><div id="tipos"></div></fieldset>
  <p id="conta"></p>
  <ul id="lista"></ul>
</main>
<script>
const DADOS = {"atualizado": "25/11/2026", "areas": {"administracao-publica": "Administração pública", "economia": "Economia", "direito": "Direito", "sistemas-de-informacao": "Sistemas de informação", "turismo": "Turismo", "engenharia-de-pesca": "Engenharia de pesca"}, "itens": [{"titulo": "Chamada Pública MCTI/CNPq/CISB/SAAB AB Nº 37/2026 - Cooperação Brasil-Suécia", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-37-2026/chamada-publica-cnpq-N-37-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": "2027-03-12"}, {"titulo": "Edital Nº 06/2026 – PNAGEI Centelha 3 Alagoas – Fapeal/Secti-AL/Sebrae-AL", "link": "https://www.fapeal.br/2026/11/edital-centelha-3-al/", "fonte": "FAPEAL", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Transnacional Conjunta Biodiversa+ (BiodivConnect) 2025-2026", "link": "https://www.fapeal.br/2026/10/chamada-transnacional-conjunta-biodiversa-biodivconnect-2025-2026/", "fonte": "FAPEAL", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública CNPq/Petrobras N° 31/2026 - Projeto InspirAÇÃO", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-31-2026/chamada-publica-cnpq-N-31-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública CNPq/CAPES Nº 30/2026 – Programa de Mestrado e Doutorado Acadêmico para Inovação – MAI/DAI", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-30-2026/chamada-publica-cnpq-N-30-2026", "fonte": "CNPq", "tipo": "pos-graduacao", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada CNPq/MIR Nº 23/2026 - Programa Lélia Gonzalez de fomento a pesquisas sobre desigualdades étnico-raciais na ciência, na educação e na sociedade brasileiras", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-23-2026/chamada-publica-cnpq-N-23-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública CNPq/MCTI N° 36/2026 - Apoio a cursos de curta duração em biodiversidade, no âmbito do Centro Franco-Brasileiro de Biodiversidade Amazônica (CFBBA)", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-36-2026/chamada-publica-cnpq-N-36-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada CNPq Nº 34/2026 - Auxílio à Promoção de Eventos Científicos, Tecnológicos e/ou de Inovação - ARC", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-34-2026/chamada-publica-cnpq-N-34-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública MCTI/CNPq/ANR N° 32/2026", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-32-2026/chamada-publica-cnpq-N-32-2026", "fonte": "CNPq", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada CNPq nº 33/2026 - Bolsas de Produtividade do CNPq", "link": "https://www.gov.br/cnpq/pt-br/chamadas/todas-as-chamadas/chamadas-2026/chamada-no-33-2026/chamada-publica-cnpq-N-33-2026", "fonte": "CNPq", "tipo": "bolsa", "areas": ["geral"], "prazo": null}, {"titulo": "Programa Bolsas para Pesquisa CAPES/Humboldt", "link": "https://www.gov.br/capes/pt-br/acesso-a-informacao/acoes-e-programas/bolsas/bolsas-e-auxilios-internacionais/encontre-aqui/paises/alemanha/programa-bolsas-para-pesquisa-capeshumboldt", "fonte": "CAPES", "tipo": "bolsa", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública para Envio de Proposta de Curso Novo - Edital nº 20/2026", "link": "https://www.gov.br/capes/pt-br/centrais-de-conteudo/editais/edital_2844920.pdf/@@display-file/file", "fonte": "CAPES", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Programa de Doutorado-sanduíche no Exterior (PDSE)", "link": "https://www.gov.br/capes/pt-br/acesso-a-informacao/acoes-e-programas/bolsas/bolsas-e-auxilios-internacionais/encontre-aqui/paises/multinacional/programa-de-doutorado-sanduiche-no-exterior-pdse", "fonte": "CAPES", "tipo": "pos-graduacao", "areas": ["geral"], "prazo": null}, {"titulo": "Estudo de Ingressantes das Licenciaturas - Edital CAPES/INEP nº 26/2026", "link": "https://www.gov.br/capes/pt-br/centrais-de-conteudo/editais/edital_2904194_sei_2903303_edital_conjunto_26_2026.pdf/@@display-file/file", "fonte": "CAPES", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Estudo de Ingressantes das Licenciaturas - Edital CAPES/INEP nº 26/2026 - Alteração", "link": "https://www.gov.br/capes/pt-br/centrais-de-conteudo/editais/edital_2906989_sei_2906818_edital_conjunto_n__26_2026___alteracao.pdf/@@display-file/file", "fonte": "CAPES", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Estudo de Ingressantes das Licenciaturas - Edital CAPES/INEP nº 26/2026 - Alteração", "link": "https://www.gov.br/capes/pt-br/centrais-de-conteudo/editais/edital_2914199_sei_2913074_edital_conjunto_capes_inep_n__26_2026___alteracao.pdf/@@display-file/file", "fonte": "CAPES", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública para Envio de Proposta de Curso Novo - Edital nº 20/2026 - Alteração", "link": "https://www.gov.br/capes/pt-br/centrais-de-conteudo/editais/edital_2931284_sei_2930362_edital_20_2026___alteracao-1.pdf/@@display-file/file", "fonte": "CAPES", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Edital Progep nº 49/2026", "link": "https://editais.ufal.br/tec-administrativos/remocao/edital-progep-no-49-2026", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Seleção de Instrutores do Centro de Inclusão Digital da Ufal (CID) -2026 Edital 08/2026 Proest", "link": "https://editais.ufal.br/assistencia-estudantil/selecao-de-instrutores-do-centro-de-inclusao-digital-da-ufal-cid-2026-edital-08-2026-proest", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Seleção de Monitores para o Programa Esporte na Ufal", "link": "https://editais.ufal.br/assistencia-estudantil/selecao-de-monitores-para-o-programa-esporte-na-ufal-1", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "EDITAL Nº 01/2026 CIE/PROPEP - Incubação de Empresas In Lab (Incubal)", "link": "https://editais.ufal.br/outros/edital-no-01-2026-cie-propep-incubacao-de-empresas-in-lab-incubal", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Seleção Bolsistas NTI 1 - 2026", "link": "https://editais.ufal.br/outros/selecao-bolsistas-nti-1-2026", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["sistemas-de-informacao"], "prazo": null}, {"titulo": "Inscrição de estudantes indígenas e quilombolas para a Bolsa Permanência do MEC", "link": "https://editais.ufal.br/assistencia-estudantil/inscricao-de-estudantes-indigenas-e-quilombolas-para-a-bolsa-permanencia-do-mec-3", "fonte": "UFAL (editais)", "tipo": "bolsa", "areas": ["geral"], "prazo": null}, {"titulo": "Processo Seletivo de Tutor(a), cotutor(a) e orientador(a) de serviço para atuação no Programa Nacional de Apoio à permanência, diversidade e visibilidade para discentes na àrea da saúde - AfirmaSUS, no âmbito da UFAL", "link": "https://editais.ufal.br/extensao/processo-seletivo-de-tutor-a-cotutor-a-e-orientador-a-de-servico-para-atuacao-no-programa-nacional-de-apoio-a-permanencia-diversidade-e-visibilidade-para-discentes-na-area-da-saude-afirmasus-no-ambito-da-ufal", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Seleção de mentores(as) científicos(as) voluntários(as) para o LabMent/Sinpete", "link": "https://editais.ufal.br/outros/selecao-de-mentores-as-cientificos-as-voluntarios-as-para-o-labment-sinpete", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Edital nº 30 - Comunicação Oral e Pôster", "link": "https://editais.ufal.br/outros/chamada-publica-no-30-2026-sinpete-ufal", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}, {"titulo": "Chamada Pública nº 27 - Prêmio InovaEDU", "link": "https://editais.ufal.br/outros/sinpete-2026-premio-inovaedu", "fonte": "UFAL (editais)", "tipo": "fomento", "areas": ["geral"], "prazo": null}]};
const TIPOS = { "fomento":"Fomento e editais", "bolsa":"Bolsas", "pos-graduacao":"Mestrado e doutorado",
                "evento":"Congressos e eventos", "concurso-vaga":"Concursos e vagas" };
const CHAVE = "radar-filtros";
let salvo = {};
try { salvo = JSON.parse(localStorage.getItem(CHAVE) || "{}"); } catch (e) {}

function caixas(destino, opcoes, marcadas) {
  const div = document.getElementById(destino);
  for (const [valor, rotulo] of Object.entries(opcoes)) {
    const l = document.createElement("label"), c = document.createElement("input");
    c.type = "checkbox"; c.value = valor; c.checked = !marcadas || marcadas.includes(valor);
    c.addEventListener("change", desenhar);
    l.append(c, " " + rotulo); div.append(l);
  }
}
const marcadas = id => [...document.querySelectorAll("#" + id + " input:checked")].map(c => c.value);
const semAcento = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function desenhar() {
  const areas = marcadas("areas"), tipos = marcadas("tipos");
  const termo = semAcento(document.getElementById("busca").value.trim());
  try { localStorage.setItem(CHAVE, JSON.stringify({ areas, tipos })); } catch (e) {}
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const itens = DADOS.itens.filter(i =>
    tipos.includes(i.tipo) &&
    (i.areas.includes("geral") || i.areas.some(a => areas.includes(a))) &&
    (!termo || semAcento(i.titulo + " " + i.fonte).includes(termo)));
  const lista = document.getElementById("lista"); lista.textContent = "";
  for (const i of itens) {
    const li = document.createElement("li"), a = document.createElement("a");
    a.href = i.link; a.textContent = i.titulo; a.target = "_blank"; a.rel = "noopener";
    const meta = document.createElement("div"); meta.className = "meta";
    const etq = document.createElement("span"); etq.className = "etq"; etq.textContent = TIPOS[i.tipo] || i.tipo;
    meta.append(etq, i.fonte + " · ");
    const prazo = document.createElement("span");
    if (i.prazo) {
      const [y, m, d] = i.prazo.split("-").map(Number), dias = Math.round((new Date(y, m - 1, d) - hoje) / 864e5);
      prazo.textContent = "prazo " + [d, m, y].map(n => String(n).padStart(2, "0")).join("/") + " (" + dias + " dias)";
      if (dias <= 14) prazo.className = "urgente";
    } else prazo.textContent = "prazo não identificado";
    meta.append(prazo, " · " + i.areas.map(s => DADOS.areas[s] || "Geral").join(", "));
    li.append(a, meta); lista.append(li);
  }
  document.getElementById("conta").textContent = itens.length + " oportunidades abertas";
}

document.getElementById("atualizado").textContent = DADOS.atualizado;
caixas("areas", DADOS.areas, salvo.areas);
caixas("tipos", TIPOS, salvo.tipos);
document.getElementById("busca").addEventListener("input", desenhar);
desenhar();
</script>
</body>
</html>
