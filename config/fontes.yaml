# Fontes monitoradas. Campos:
#   nome         como aparece no site e na newsletter
#   url          página de listagem (ou feed)
#   formato      html (padrão) ou rss
#   padrao_link  opcional, regex que o endereço do item deve conter. Sem ele,
#                o robô aceita links cujo texto pareça uma oportunidade.
#   tipo_padrao  opcional: fomento, bolsa, pos-graduacao, evento, concurso-vaga
#   ativa        false desliga a fonte sem apagar
#
# Calibrado em 25/11/2026 com a primeira execução contra os sites reais.
# Sempre que uma fonte vier vazia ou com lixo, ajuste o "padrao_link".

fontes:
  - nome: CNPq
    url: https://www.gov.br/cnpq/pt-br/chamadas/abertas-para-submissao
    # só a página de cada chamada (sem anexos nem botões de compartilhar)
    padrao_link: ^https://www\.gov\.br/cnpq/pt-br/chamadas/todas-as-chamadas/.*/chamada-[^/.]*$
    tipo_padrao: fomento

  - nome: CAPES
    url: https://www.gov.br/capes/pt-br/assuntos/editais-e-resultados-capes/
    tipo_padrao: bolsa

  - nome: Finep
    # Desativada em 25/11/2026: o site foi refeito e a lista de chamadas
    # (https://www.finep.gov.br/oportunidades) é carregada por um serviço
    # protegido, fora do alcance deste coletor. Tratar por alerta ou feed.
    url: https://www.finep.gov.br/oportunidades
    padrao_link: /e/chamada-publica/
    tipo_padrao: fomento
    ativa: false

  - nome: FAPEAL
    url: https://www.fapeal.br/tag/editais/
    tipo_padrao: fomento

  - nome: UFAL (editais)
    url: https://editais.ufal.br/
    # o link de cada edital diz só "Acessar"; o título vem do cartão
    padrao_link: ^https://editais\.ufal\.br/[a-z0-9-]+/[^?]+$
    tipo_padrao: fomento

  # A acrescentar depois de confirmar o endereço da listagem de cada uma:
  #   - seleções de mestrado e doutorado da UFAL (SIGAA público, que depende de
  #     JavaScript e talvez exija outro tipo de coletor)
  #   - eventos da SBC e encontros da ANPEC
  #   - um agregador de concursos e uma fonte de vagas e estágios em TI
