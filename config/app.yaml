# Cadastro e entrada no aplicativo (opcionais). Enquanto qualquer campo abaixo
# estiver vazio, o app NÃO mostra o botão "Entrar" e não coleta dados pessoais.
# Passo a passo para ativar: supabase/LEIAME.md

# Controlador dos dados (LGPD, art. 5º, VI): quem decide sobre o tratamento e
# atende os pedidos dos titulares. Aparece na política de privacidade.
controlador:
  nome: ""
  email: ""        # contato para pedidos de acesso, correção e exclusão

# Projeto Supabase (Project Settings > API). A "anon public key" é pública por
# natureza: a proteção dos dados está nas regras do banco (supabase/schema.sql).
supabase:
  url: ""          # ex.: https://abcdefghijkl.supabase.co
  chave_publica: ""

# Mude a versão sempre que alterar a política de privacidade: quem já tem conta
# será convidado a aceitar a nova versão.
privacidade:
  versao: "2026-11-25"
  # Região onde o projeto Supabase foi criado. "sa-east-1" (São Paulo) evita
  # transferência internacional de dados; com outra região, a política avisa.
  regiao_supabase: "sa-east-1"
