name: Radar de Oportunidades

on:
  schedule:
    - cron: "0 9 * * *"   # todo dia às 6h de Alagoas
  workflow_dispatch:

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testes
        run: python -m unittest discover -s tests
      - name: Coletar e gerar site
        run: python radar.py tudo --perfil valber
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
      - name: Salvar resultado
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add -A dados docs saida
          git diff --cached --quiet || git commit -m "Radar: atualização diária"
          git push
